<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Tempo Juntos ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #ffe3ec 0%, #ffb6c1 100%); display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .tadc-corner { position: absolute; width: 80px; height: 80px; z-index: 5; }
        .top-left { top: 20px; left: 20px; border-left: 8px solid #00bfff; border-top: 8px solid #ff4757; border-radius: 15px 0 0 0; }
        .top-left::before { content: '✦'; position: absolute; color: #ffa500; font-size: 24px; top: 5px; left: 5px; }
        .top-right { top: 20px; right: 20px; border-right: 8px solid #ff4757; border-top: 8px solid #ffa500; border-radius: 0 15px 0 0; }
        .bottom-left { bottom: 20px; left: 20px; border-left: 8px solid #ffa500; border-bottom: 8px solid #00bfff; border-radius: 0 0 0 15px; }
        .bottom-right { bottom: 20px; right: 20px; border-right: 8px solid #00bfff; border-bottom: 8px solid #ff4757; border-radius: 0 0 15px 0; }
        .bottom-right::before { content: '♦'; position: absolute; color: #ff4757; font-size: 24px; bottom: 5px; right: 5px; }
        .container { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(234, 84, 85, 0.2); text-align: center; max-width: 500px; width: 90%; border: 4px solid #ff6b81; z-index: 10; }
        h1 { color: #ff4757; margin-bottom: 15px; font-size: 2rem; }
        p.subtitle { color: #4a4a4a; margin-bottom: 30px; font-size: 1.1rem; line-height: 1.5; font-style: italic; }
        .btn-reveal { background: linear-gradient(45deg, #ff4757, #ff6b81); color: white; border: none; padding: 15px 35px; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); transition: transform 0.2s, box-shadow 0.2s; }
        .btn-reveal:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6); }
        .counter-box { display: none; margin-top: 25px; animation: fadeIn 1s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .grid-counter { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .time-card { background: #fff0f3; padding: 15px; border-radius: 12px; border: 2px solid #ffb6c1; }
        .time-value { display: block; font-size: 1.8rem; font-weight: bold; color: #ff4757; }
        .time-label { font-size: 0.85rem; color: #a4b0be; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="tadc-corner top-left"></div><div class="tadc-corner top-right"></div><div class="tadc-corner bottom-left"></div><div class="tadc-corner bottom-right"></div>
    <div class="container">
        <h1>Feliz Dia dos Namorados! ❤️</h1>
        <p class="subtitle">"Quero viver com você nessa, e em todas as vidas que eu tiver sorte de te encontrar"</p>
        <button class="btn-reveal" id="revealBtn">Descobrir Nosso Tempo Juntos</button>
        <div class="counter-box" id="counterBox">
            <h3>Estamos juntos há exatamente:</h3>
            <div class="grid-counter">
                <div class="time-card"><span class="time-value" id="years">0</span><span class="time-label">Anos</span></div>
                <div class="time-card"><span class="time-value" id="months">0</span><span class="time-label">Meses</span></div>
                <div class="time-card"><span class="time-value" id="days">0</span><span class="time-label">Dias</span></div>
                <div class="time-card"><span class="time-value" id="hours">0</span><span class="time-label">Horas</span></div>
                <div class="time-card"><span class="time-value" id="minutes">0</span><span class="time-label">Minutos</span></div>
                <div class="time-card"><span class="time-value" id="seconds">0</span><span class="time-label">Segundos</span></div>
            </div>
        </div>
    </div>
    <script>
        const revealBtn = document.getElementById('revealBtn');
        const counterBox = document.getElementById('counterBox');
        const startDate = new Date('2025-03-10T00:00:00');
        function updateCounter() {
            const now = new Date();
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            if (days < 0) { months--; const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0); days += prevMonth.getDate(); }
            if (months < 0) { years--; months += 12; }
            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = now.getHours();
            document.getElementById('minutes').innerText = now.getMinutes();
            document.getElementById('seconds').innerText = now.getSeconds();
        }
        revealBtn.addEventListener('click', () => { counterBox.style.display = 'block'; revealBtn.style.display = 'none'; updateCounter(); setInterval(updateCounter, 1000); });
    </script>
</body>
</html>
